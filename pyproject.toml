[project]
name = "ersatz-parts"
version = "0.0.1"
description = "Find and verify form, fit and function replacements for discontinued electronic components."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lawrence Panes" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pint>=0.26.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ersatz = "ersatz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ersatz"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
